name: CI

# The gate a pull request has to pass. Nothing runs on a push to main: a pull request must be green
# to merge, so re-running the same matrix on the merge commit proves nothing and costs a machine —
# nightly.yml builds main after the merge instead. workflow_call stays because release.yml runs this
# as its own first gate.
on:
  pull_request:
    branches: [main]
  workflow_call: {}
  workflow_dispatch: {}

jobs:
  ci:
    uses: Hawkynt/RepositoryTemplate/.github/workflows/dotnet-ci.yml@v1
    with:
      solution: PhotoManager.slnx
      test-target: PhotoManager.Tests/PhotoManager.Tests.csproj
      dotnet-version: '8.x'
      os-matrix: '["ubuntu-latest","windows-latest","macos-latest"]'
      # PhotoManager.Core has a ..\..\CompressionWorkbench\FileFormat.JpegArchive\... reference, so
      # the sibling has to sit BESIDE the workspace — which actions/checkout cannot do.
      clone-siblings: '[{"repository":"Hawkynt/CompressionWorkbench","path":"../CompressionWorkbench"}]'
      # One runner only: the committed reference must not depend on which machine produced it.
      package-readme-os: ubuntu-latest
