name: CI

# The gate a pull request has to pass. Nothing runs on a push to main: a pull request must be green
# to merge, so re-running the same matrix on the merge commit proves nothing and costs a machine —
# nightly.yml builds main after the merge instead. workflow_call stays because release.yml runs this
# as its own first gate.
on:
  pull_request:
    branches: [main]
  workflow_call: {}
  workflow_dispatch: {}

jobs:
  ci:
    uses: Hawkynt/RepositoryTemplate/.github/workflows/dotnet-ci.yml@v1
    with:
      solution: PhotoManager.slnx
      test-target: PhotoManager.Tests/PhotoManager.Tests.csproj
      dotnet-version: '8.x'
      os-matrix: '["ubuntu-latest","windows-latest","macos-latest"]'
      # PhotoManager.Core has a ..\..\CompressionWorkbench\FileFormat.JpegArchive\... reference, so
      # the sibling has to sit BESIDE the workspace — which actions/checkout cannot do.
      clone-siblings: '[{"repository":"Hawkynt/CompressionWorkbench","path":"../CompressionWorkbench"}]'
      # One runner only: the committed reference must not depend on which machine produced it.
      package-readme-os: ubuntu-latest

  screenshots:
    name: README screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Clone sibling CompressionWorkbench
        shell: bash
        run: git clone --depth 1 https://github.com/Hawkynt/CompressionWorkbench.git "$GITHUB_WORKSPACE/../CompressionWorkbench"

      - name: Generate README screenshots
        env:
          PHOTOMANAGER_CAPTURE_SCREENSHOTS: '1'
        run: >
          dotnet test PhotoManager.Tests/PhotoManager.Tests.csproj
          --configuration Release
          --filter Category=Screenshot
          --logger "trx;LogFileName=screenshot-tests.trx"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: readme-screenshots
          path: |
            screenshots/*.png
            PhotoManager.Tests/TestResults/screenshot-tests.trx
          if-no-files-found: warn

      - name: Verify README screenshots are current
        shell: bash
        run: |
          test -s screenshots/main-window.png
          test -s screenshots/develop-window.png
          git ls-files --error-unmatch screenshots/main-window.png >/dev/null
          git ls-files --error-unmatch screenshots/develop-window.png >/dev/null
          grep -Fq '![PhotoManager library window](screenshots/main-window.png)' README.md
          grep -Fq '![PhotoManager develop window](screenshots/develop-window.png)' README.md
          git diff --exit-code -- screenshots/
